<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pemantauan Data</title>
    <style>
        body { font-family: system-ui; max-width: 900px; margin: 0 auto; padding: 20px; background: #f8fafc; }
        h1 { color: #1e293b; text-align: center; }
        .kotak { background: white; padding: 20px; border-radius: 10px; margin: 15px 0; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .angka { font-size: 24px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body>
    <h1>📈 Sistem Pemantauan Data</h1>

    <div class="kotak">
        <h3>Ringkasan</h3>
        <p>Total Masuk: <span id="masuk" class="angka">0</span></p>
        <p>Total Keluar: <span id="keluar" class="angka">0</span></p>
        <p>Selisih: <span id="selisih" class="angka">0</span></p>
    </div>

    <div class="kotak">
        <h3>Daftar Catatan</h3>
        <table>
            <thead><tr><th>ID</th><th>Jenis</th><th>Jumlah</th><th>Tanggal</th></tr></thead>
            <tbody id="daftar"></tbody>
        </table>
    </div>

    <script src="koneksi.js"></script>
</body>
</html>
